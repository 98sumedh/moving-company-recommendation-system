# Every number the SYNTHETIC data generator uses, with its source.
#
# Entry format
#   value:        the number(s) the code reads
#   description:  what it controls
#   source:       where it comes from (URL for public sources)
#   source_type:  company_kb        - company knowledge base / service catalog / staff, Nov 2026 (paraphrased)
#                 public            - a public web page (url required)
#                 public_derived    - computed or interpolated from a public number (url required)
#                 generic_reasoning - no source; a stated, plausible guess
#   confidence:   high | medium | low
#   used_in:      module(s) that read it
#
# Rules: the generator reads numbers only from this file. Tests fail on a missing field,
# a public entry without a url, or an entry the code never reads. Once tagged generator-v1,
# changes need a new tag and a changelog note with a business reason.
#
# Note on sources: the Kaggle U-Haul rental-rates dataset could not be located (Nov 2026
# search found only a morph.io scraper). U-Haul's own truck-size guide is cited instead.
# Several public cost guides are content-marketing pages; their numbers are treated as
# rough ranges (confidence medium/low), not facts.

# ---------------------------------------------------------------- volume & calendar
n_bookings:
  value: 50000
  description: Bookings over the 2-year window (about 68 per day)
  source: "Company staff, Nov 2026: the company does about 70 jobs per day"
  source_type: company_kb
  confidence: high
  used_in: [generate.py]

date_range:
  value: {start: "2024-10-01", months: 24}
  description: Move-date window. Two full peak seasons; ends before the present.
  source: "Chosen so a later season can be held out for testing"
  source_type: generic_reasoning
  confidence: high
  used_in: [timeline.py]

annual_growth:
  value: 0.05
  description: Year-over-year volume growth (linear over the window)
  source: "Modest growth for an established regional mover"
  source_type: generic_reasoning
  confidence: low
  used_in: [timeline.py]

month_multiplier:
  value: {1: 0.75, 2: 0.75, 3: 0.90, 4: 0.95, 5: 1.15, 6: 1.35, 7: 1.30, 8: 1.25, 9: 1.05, 10: 0.95, 11: 0.80, 12: 0.80}
  description: Relative move volume by month. Gives ~42% of moves in May-Aug and ~51% in May-Sep.
  source: "MoveBuddha: ~41% of US moves happen May-Aug; National Van Lines: roughly half happen May-Sep. Winter dip kept mild for San Diego weather."
  url: "https://movebuddha.com/blog/peak-moving-season/ ; https://www.nationalvanlines.com/blog/why-moving-june-costs-22-more-how-time-right/"
  source_type: public_derived
  confidence: medium
  used_in: [timeline.py]

weekday_multiplier:
  value: {Mon: 0.85, Tue: 0.85, Wed: 0.90, Thu: 0.95, Fri: 1.20, Sat: 1.35, Sun: 0.90}
  description: Relative volume by day of week
  source: "Fridays and Saturdays are popular because customers are off work; Sunday is lighter"
  source_type: generic_reasoning
  confidence: medium
  used_in: [timeline.py]

month_end_lift:
  value: {last_days: 3, last_days_multiplier: 1.30, first_day_multiplier: 1.20}
  description: Extra volume around month end and the 1st (leases turn over)
  source: "MoveBuddha notes June 1 and June 30 as the busiest moving dates"
  url: "https://movebuddha.com/blog/peak-moving-season/"
  source_type: public_derived
  confidence: medium
  used_in: [timeline.py]

holiday_multiplier:
  value: {dates: ["01-01", "07-04", "12-25"], multiplier: 0.2}
  description: Few moves on major holidays
  source: "Crews and customers rarely move on these days"
  source_type: generic_reasoning
  confidence: medium
  used_in: [timeline.py]

